allowBuilds:
  core-js: false
  esbuild: false
  unrs-resolver: false

# Already pnpm's default, made explicit because the build relies on it:
# `@clevercloud/client` is only declared in `peerDependencies`, and our own
# build, tests and CDN bundle get it from this automatic install.
autoInstallPeers: true

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - '@clevercloud/client'

# Pin axe-core to the version used before the pnpm migration (the npm lockfile
# had 4.4.3). Newer versions flag pre-existing color-contrast issues on skeleton
# placeholders; addressing those is tracked separately as an a11y task.
overrides:
  axe-core: 4.4.3
